# Weekly pull requests for dependency updates, grouped so they're easy to
# review. Security fixes open straight away, whatever the schedule.
# Major versions (Prisma 7, Express 5, React Router 7…) change how the code
# has to be written, so they're upgraded on purpose rather than by a bot PR.
# Vercel doesn't build Dependabot branches (vercel.json); upgrades are tried
# on the preview branch like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
