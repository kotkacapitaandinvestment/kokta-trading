<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C0C0E" />
<title>Offline | Kotka</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #050504; color: #EDE8DD; font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 22rem; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 50%; }
  h1 { font-size: 20px; margin: 18px 0 6px; color: #fff; letter-spacing: -0.01em; }
  p { margin: 0; color: #948A7D; }
  button { margin-top: 22px; background: #D1A85B; color: #050504; border: 0; border-radius: 10px; padding: 10px 18px; font: 600 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/kotka-mark-128.png" alt="" />
  <h1>You're offline</h1>
  <p>Kotka needs a connection for live data, messages and research. Pages you opened recently will load again once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
